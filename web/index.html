<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音源分离工作台</title>
<style>
:root{
  --bg:#0b0d12; --panel:#12151d; --panel2:#171b25; --border:#232936;
  --text:#e6eaf2; --dim:#7d879b; --dim2:#525c70;
  --accent:#3ddc9a; --accent-d:rgba(61,220,154,.12); --accent-b:rgba(61,220,154,.35);
  --warn:#f0b429; --err:#f45b69; --blue:#5b8def;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(800px 400px at 15% -10%,rgba(61,220,154,.07),transparent 70%),
    radial-gradient(600px 300px at 90% 0%,rgba(91,141,239,.06),transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:26px 24px 60px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),#2ba3c9);
  display:grid;place-items:center;font-weight:800;color:#06120d;font-size:15px;
  box-shadow:0 0 22px rgba(61,220,154,.28);
}
h1{font-size:17px;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:0}
.status{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  padding:6px 13px;border-radius:20px;font-size:12px;
  background:var(--panel);border:1px solid var(--border);color:var(--dim);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.dot.ready{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dot.err{background:var(--err)}
.dot.load{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:372px 1fr;gap:20px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:18px;
}
.card + .card{margin-top:16px}
.card h2{
  font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim2);margin-bottom:14px;
}

/* ---------- dropzone ---------- */
#drop{
  border:1.5px dashed var(--border);border-radius:11px;padding:26px 16px;
  text-align:center;cursor:pointer;transition:.18s;background:var(--panel2);
}
#drop:hover{border-color:var(--dim2);background:#1a1f2b}
#drop.over{border-color:var(--accent);background:var(--accent-d);box-shadow:0 0 0 3px rgba(61,220,154,.08)}
#drop .ico{font-size:26px;opacity:.55;margin-bottom:8px;line-height:1}
#drop .t1{font-size:13px;color:#c3cbd9}
#drop .t2{font-size:11.5px;color:var(--dim2);margin-top:4px}
.filebox{
  display:none;align-items:center;gap:10px;margin-top:12px;
  padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
}
.filebox.on{display:flex}
.filebox .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebox .meta{font:11px/1 var(--mono);color:var(--dim);flex:none}
.filebox .x{cursor:pointer;color:var(--dim2);font-size:16px;line-height:1;padding:2px 4px}
.filebox .x:hover{color:var(--err)}

/* ---------- prompts ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.chip{
  padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--border);color:#b9c2d2;
  transition:.15s;user-select:none;white-space:nowrap;
}
.chip:hover{border-color:var(--dim2);color:#dde3ee}
.chip.on{background:var(--accent-d);border-color:var(--accent-b);color:var(--accent);font-weight:500}
.chip .k{opacity:.5;font-size:11px;margin-left:4px}
input[type=text],select{
  width:100%;padding:9px 12px;border-radius:9px;font-size:13px;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  font-family:inherit;outline:none;transition:.15s;
}
input[type=text]:focus,select:focus{border-color:var(--accent-b);box-shadow:0 0 0 3px rgba(61,220,154,.07)}
input::placeholder{color:var(--dim2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.field label{display:block;font-size:11px;color:var(--dim2);margin-bottom:5px;letter-spacing:.3px}

/* ---------- buttons ---------- */
.btn{
  width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:inherit;transition:.18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2fbf87);color:#06120d}
.btn.primary:hover:not(:disabled){box-shadow:0 4px 20px rgba(61,220,154,.3);transform:translateY(-1px)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:#c3cbd9}
.btn.ghost:hover{border-color:var(--err);color:var(--err)}
.btn.sm{width:auto;padding:7px 14px;font-size:12px;border-radius:8px}
.mt{margin-top:13px}

/* ---------- progress ---------- */
.prog-wrap{display:none}
.prog-wrap.on{display:block}
.pbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:10px 0 9px}
.pfill{
  height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#2fbf87,var(--accent));
  transition:width .45s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 12px rgba(61,220,154,.45);
}
.pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.pstage{color:#b9c2d2}

/* ---------- results ---------- */
.empty{
  text-align:center;padding:64px 20px;color:var(--dim2);
  border:1px dashed var(--border);border-radius:14px;
}
.empty .big{font-size:32px;opacity:.25;margin-bottom:12px}
.empty .p{font-size:13px;color:var(--dim);margin-bottom:6px}
.empty .s{font-size:12px}

.res{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;animation:fadeUp .3s ease both;
}
.res + .res{margin-top:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.res-name{font-size:13.5px;font-weight:600;font-family:var(--mono);color:var(--accent)}
.badge{
  font:11px/1 var(--mono);padding:4px 8px;border-radius:5px;
  background:var(--panel2);border:1px solid var(--border);color:var(--dim);
}
.badge.good{color:var(--accent);border-color:var(--accent-b);background:var(--accent-d)}
.res-head .sp{margin-left:auto}
audio{width:100%;height:34px;filter:invert(.92) hue-rotate(180deg);border-radius:6px}
.res audio{margin-bottom:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.dl{
  font-size:12px;padding:6px 12px;border-radius:7px;text-decoration:none;
  background:var(--panel2);border:1px solid var(--border);color:#c3cbd9;transition:.15s;
  font-family:inherit;cursor:pointer;
}
.dl:hover{border-color:var(--accent-b);color:var(--accent)}
.spec{margin-top:12px;border-radius:9px;overflow:hidden;border:1px solid var(--border);display:none}
.spec.on{display:block}
.spec img{width:100%;display:block}
.toggle{
  font-size:12px;color:var(--dim);cursor:pointer;margin-top:11px;
  display:inline-flex;align-items:center;gap:5px;user-select:none;
}
.toggle:hover{color:var(--accent)}
.toggle .arw{transition:.2s;font-size:10px}
.toggle.on .arw{transform:rotate(90deg)}

.err-box{
  background:rgba(244,91,105,.08);border:1px solid rgba(244,91,105,.35);
  color:#ffb3ba;border-radius:10px;padding:12px 14px;font-size:12.5px;
  font-family:var(--mono);word-break:break-all;
}
.hint{font-size:11.5px;color:var(--dim2);margin-top:11px;line-height:1.65}
kbd{
  font:11px/1 var(--mono);background:var(--panel2);border:1px solid var(--border);
  border-radius:4px;padding:2px 5px;color:var(--dim);
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">音</div>
    <div>
      <h1>音源分离工作台 <span>SAM-Audio · 本地推理</span></h1>
    </div>
    <div class="status"><span class="dot load" id="dot"></span><span id="engineTxt">正在连接…</span></div>
  </header>

  <main>
    <!-- ============ 左：控制 ============ -->
    <div>
      <div class="card">
        <h2>1 · 选择素材</h2>
        <div id="drop">
          <div class="ico">♪</div>
          <div class="t1">把音视频文件拖到这里</div>
          <div class="t2">或点击选择 · mp4 / mov / mkv / wav / mp3 / m4a</div>
        </div>
        <input type="file" id="file" accept="audio/*,video/*" hidden>
        <div class="filebox" id="filebox">
          <span class="nm" id="fname"></span>
          <span class="meta" id="fmeta"></span>
          <span class="x" id="fclear" title="移除">×</span>
        </div>
      </div>

      <div class="card">
        <h2>2 · 要分离出什么</h2>
        <div class="chips" id="chips"></div>
        <input type="text" id="custom" placeholder="自定义提示词，回车添加（小写英文，如 turbo whistle）">
        <div class="hint">点击上方标签可多选，会给每个提示词各出一份结果，方便对比。</div>
      </div>

      <div class="card">
        <h2>3 · 参数</h2>
        <div class="row">
          <div class="field">
            <label>低通滤波</label>
            <select id="lowpass">
              <option value="0">不处理（保留高频）</option>
              <option value="3000">3000 Hz · 温和</option>
              <option value="2000" selected>2000 Hz · 推荐</option>
              <option value="1500">1500 Hz · 激进</option>
            </select>
          </div>
          <div class="field">
            <label>切段长度（秒）</label>
            <select id="chunk">
              <option value="10">10 · 显存最省</option>
              <option value="15" selected>15 · 推荐</option>
              <option value="20">20 · 段数更少</option>
            </select>
          </div>
        </div>
        <div class="hint">低通只作用于分离结果，把中高频的音乐残留切掉，引擎低频不受影响。</div>
      </div>

      <div class="card">
        <button class="btn primary" id="go" disabled>开始分离</button>
        <button class="btn ghost mt" id="cancel" style="display:none">取消任务</button>
        <div class="hint" style="text-align:center">
          首次使用需等模型加载约 20 秒
        </div>
      </div>
    </div>

    <!-- ============ 右：进度与结果 ============ -->
    <div>
      <div class="card prog-wrap" id="progCard">
        <h2>进度</h2>
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
        <div class="pmeta">
          <span class="pstage" id="pstage">准备中…</span>
          <span id="ppct">0%</span>
        </div>
      </div>

      <div id="results"></div>

      <div class="empty" id="empty">
        <div class="big">◎</div>
        <div class="p">还没有分离结果</div>
        <div class="s">选一段素材，按「开始分离」</div>
      </div>
    </div>
  </main>
</div>

<script>
const PRESETS = [
  ["car engine","通用汽车引擎"],
  ["engine revving","轰油门"],
  ["engine idle","怠速"],
  ["exhaust rumble","排气低吼"],
  ["motorcycle engine","摩托车"],
  ["music","只要音乐（反向）"],
];

const $ = id => document.getElementById(id);
let fileInfo = null;      // {upload, filename, duration}
let chosen = new Set(["car engine"]);
let polling = null;
let lastJobId = null;

/* ---------- 提示词 chips ---------- */
function renderChips(){
  $("chips").innerHTML = "";
  PRESETS.forEach(([p, desc])=>{
    const d = document.createElement("div");
    d.className = "chip" + (chosen.has(p) ? " on" : "");
    d.innerHTML = `${p}<span class="k">${desc}</span>`;
    d.onclick = ()=>{
      chosen.has(p) ? chosen.delete(p) : chosen.add(p);
      renderChips(); syncGo();
    };
    $("chips").appendChild(d);
  });
  // 自定义已选但不在预设里的
  [...chosen].filter(p=>!PRESETS.some(([x])=>x===p)).forEach(p=>{
    const d = document.createElement("div");
    d.className = "chip on";
    d.innerHTML = `${p}<span class="k">自定义</span>`;
    d.onclick = ()=>{ chosen.delete(p); renderChips(); syncGo(); };
    $("chips").appendChild(d);
  });
}
$("custom").addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const v = $("custom").value.trim().toLowerCase();
  if(!v) return;
  chosen.add(v);
  $("custom").value = "";
  renderChips(); syncGo();
});

/* ---------- 文件选择 ---------- */
const drop = $("drop");
drop.onclick = ()=> $("file").click();
["dragenter","dragover"].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("over"); });
});
["dragleave","drop"].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove("over"); });
});
drop.addEventListener("drop", e=>{
  const f = e.dataTransfer.files[0];
  if(f) upload(f);
});
$("file").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(f) upload(f);
});
$("fclear").onclick = ()=>{
  fileInfo = null;
  $("filebox").classList.remove("on");
  $("file").value = "";
  syncGo();
};

// 刷新页面后，从服务端恢复最近一次上传的素材
function adoptLast(s){
  if(fileInfo || !s.last) return;
  fileInfo = s.last;
  $("fname").textContent = s.last.filename;
  $("fmeta").textContent = fmtDur(s.last.duration) + " · 已就绪";
  $("filebox").classList.add("on");
  syncGo();
}

async function upload(f){
  $("fname").textContent = f.name;
  $("fmeta").textContent = "上传中…";
  $("filebox").classList.add("on");
  try{
    const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}`, {
      method:"POST", body:f
    });
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || "上传失败");
    fileInfo = {upload:j.upload, filename:j.filename, duration:j.duration};
    const mb = (j.size/1048576).toFixed(1);
    const src = j.src_size ? ` · 原文件 ${(j.src_size/1048576).toFixed(0)}MB` : "";
    $("fmeta").textContent = fmtDur(j.duration) + " · 音频 " + mb + "MB" + src;
  }catch(err){
    $("fmeta").textContent = "失败";
    alert("上传失败：" + err.message);
    fileInfo = null;
  }
  syncGo();
}

function fmtDur(s){
  if(!s) return "—";
  const m = Math.floor(s/60), r = Math.round(s%60);
  return m ? `${m}分${String(r).padStart(2,"0")}秒` : `${r}秒`;
}

/* ---------- 按钮态 ---------- */
function syncGo(){
  $("go").disabled = !fileInfo || chosen.size === 0;
}

/* ---------- 启动任务 ---------- */
$("go").onclick = async ()=>{
  if(!fileInfo) return;
  const body = {
    upload: fileInfo.upload,
    filename: fileInfo.filename,
    prompts: [...chosen],
    lowpass: parseInt($("lowpass").value,10),
    chunk: parseFloat($("chunk").value),
  };
  $("go").disabled = true;
  $("go").textContent = "启动中…";
  try{
    const r = await fetch("/api/run", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "启动失败");
    lastJobId = j.job;
    $("empty").style.display = "none";
    $("results").innerHTML = "";
    $("progCard").classList.add("on");
    startPolling();
  }catch(err){
    alert(err.message);
    $("go").textContent = "开始分离";
    syncGo();
  }
};

$("cancel").onclick = async ()=>{
  await fetch("/api/cancel", {method:"POST"});
  $("cancel").textContent = "正在取消…";
};

/* ---------- 轮询 ---------- */
function startPolling(){
  if(polling) return;
  polling = setInterval(tick, 800);
  tick();
}

async function tick(){
  let s;
  try{
    s = await (await fetch("/api/state")).json();
  }catch(e){ return; }

  // 引擎状态
  const dot = $("dot"), txt = $("engineTxt");
  if(s.engine === "ready"){ dot.className = "dot ready"; txt.textContent = s.engine_note; }
  else if(s.engine === "error"){ dot.className = "dot err"; txt.textContent = s.engine_note; }
  else { dot.className = "dot load"; txt.textContent = s.engine_note; }

  adoptLast(s);

  const j = s.job;
  if(!j) return;

  const running = j.status === "running" || j.status === "queued";
  $("progCard").classList.toggle("on", running || j.status === "error");
  $("cancel").style.display = running ? "block" : "none";
  $("go").textContent = running ? "分离中…" : "开始分离";
  if(!running) syncGo();

  if(running){
    const p = Math.round(j.progress * 100);
    $("pfill").style.width = p + "%";
    $("ppct").textContent = p + "%";
    $("pstage").textContent = j.stage + (j.elapsed ? `  ·  ${j.elapsed}s` : "");
  }else{
    $("pfill").style.width = "100%";
    $("ppct").textContent = j.status === "done" ? "100%" : "—";
    $("pstage").textContent = j.stage;
  }

  renderResults(j);

  if(!running){
    clearInterval(polling); polling = null;
    syncGo();
    $("cancel").textContent = "取消任务";
  }
}

/* ---------- 结果渲染 ---------- */
let renderedKey = "";
function renderResults(j){
  const key = j.id + "|" + j.results.map(r=>r.prompt).join(",") + "|" + j.status;
  if(key === renderedKey) return;
  renderedKey = key;

  const box = $("results");
  box.innerHTML = "";

  if(j.status === "error"){
    const d = document.createElement("div");
    d.className = "err-box";
    d.textContent = "出错了：" + (j.error || "未知错误");
    box.appendChild(d);
    $("empty").style.display = "none";
    return;
  }

  if(j.results.length === 0){
    $("empty").style.display = "";
    if(j.status === "cancelled") $("pstage").textContent = "已取消，未产生输出";
    return;
  }
  $("empty").style.display = "none";

  j.results.forEach(r=>{
    const el = document.createElement("div");
    el.className = "res";
    const good = r.energy < -5;
    el.innerHTML = `
      <div class="res-head">
        <span class="res-name">${esc(r.prompt)}</span>
        <span class="badge">${fmtDur(r.duration)}</span>
        <span class="badge ${good?"good":""}" title="目标音轨与剩余音轨的 RMS 能量之差；音乐占比越高，这个值越接近 0">能量比 ${r.energy} dB</span>
        <span class="sp"></span>
        <button class="btn ghost sm" data-dl="${r.target}">下载 ${esc(r.prompt)}</button>
      </div>
      <audio controls preload="metadata" src="${r.target}"></audio>
      <div class="actions">
        <a class="dl" href="${r.residual}" download>下载剩余音轨</a>
        <button class="dl open-dir" data-job="${j.id}">打开所在文件夹</button>
        ${r.spec ? `<span class="toggle" data-spec="${r.spec}"><span class="arw">▶</span> 查看频谱图</span>` : ""}
      </div>
      ${r.spec ? `<div class="spec"><img loading="lazy" src="${r.spec}" alt="spectrogram"></div>` : ""}
    `;
    el.querySelector("[data-dl]").onclick = ()=> location.href = r.target + "?dl=1";
    const od = el.querySelector(".open-dir");
    if(od) od.onclick = ()=> fetch("/api/reveal", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({job: j.id})
    });
    const tg = el.querySelector("[data-spec]");
    if(tg){
      tg.onclick = ()=>{
        const sp = el.querySelector(".spec");
        sp.classList.toggle("on");
        tg.classList.toggle("on");
      };
    }
    box.appendChild(el);
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- init ---------- */
renderChips();
syncGo();
startPolling();
</script>
</body>
</html>
